<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>妙玉　2020 戲曲夢工場　節目手冊｜劉亮延 劇作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@300;400;600;700&display=swap">
<style>
:root{--measure:34rem;--wide:52rem;--fs:1.0625rem;--cinnabar:#A8453A;
  --ink:#F3EFE6;--ink-2:#EAE5DA;--ink-3:#E3DDD0;--paper:#1F1B17;--paper-dim:#4C4740;--muted:#7A746B;
  --gold:#8C6D3F;--gold-dim:#B39868;--rule:rgba(31,27,23,.14)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:"Noto Serif TC","EB Garamond","Songti TC",serif;
  font-size:var(--fs);line-height:1.95;font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--gold);text-underline-offset:.25em;text-decoration-thickness:.5px}
a:focus-visible,summary:focus-visible{outline:2px solid var(--cinnabar);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--measure);margin:0 auto;padding:0 1.35rem}
section{padding:2.6rem 0}
section+section{border-top:1px solid var(--rule)}
.nav{display:flex;justify-content:space-between;align-items:baseline;padding:1.2rem 0 .9rem;border-bottom:1px solid var(--rule);
  font-family:"Noto Sans TC",sans-serif;font-size:.74rem;letter-spacing:.16em;color:var(--muted)}
.nav .home{color:var(--paper);text-decoration:none}
.nav .home i{display:inline-block;width:.55em;height:.55em;background:var(--cinnabar);margin-right:.6em;vertical-align:.05em}
.nav a{color:var(--muted);text-decoration:none}
h1{font-size:1.75rem;font-weight:600;line-height:1.4;margin:0;letter-spacing:.04em}
h1 .en{display:block;font-family:"EB Garamond",serif;font-style:italic;font-size:1.05rem;font-weight:400;color:var(--gold);letter-spacing:.02em;margin-top:.35rem}
.eyebrow{font-family:"Noto Sans TC",sans-serif;font-size:.72rem;letter-spacing:.2em;color:var(--muted);margin:0 0 1rem}
p{margin:0 0 1.05em;text-align:justify;overflow-wrap:break-word;line-break:strict}
p:last-child{margin-bottom:0}
p i,p em{font-family:"EB Garamond",serif;font-style:italic;font-size:1.04em}
.lead{font-size:1.12rem;line-height:1.9}
.pending{color:var(--cinnabar)}
figure{margin:1.8rem 0}
figure img{border-radius:1px;width:100%;object-fit:cover;background:var(--ink-2);color:transparent}
figcaption{font-family:"Noto Sans TC",sans-serif;font-size:.74rem;line-height:1.75;color:var(--muted);margin-top:.7rem;text-align:center}
figcaption b{color:var(--paper-dim);font-weight:500}
footer{padding:3rem 0 4rem;text-align:center;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:.78rem;line-height:2;border-top:1px solid var(--rule);margin-top:2.6rem}
footer .cjk{font-family:"Noto Serif TC",serif;font-size:1.5rem;letter-spacing:.5em;text-indent:.5em;color:var(--paper);margin-bottom:.5rem}
footer .lat{font-family:"EB Garamond",serif;font-style:italic;font-size:1.05rem;color:var(--gold);margin-bottom:1.6rem}
@media (min-width:46rem){:root{--fs:1.09rem}.wrap{padding:0 2rem}section{padding:3.4rem 0}}
footer.seal .wm{width:min(22rem,88%);height:auto;margin:0 auto 1.4rem;display:block}
footer.seal .stamp{width:5.2rem;height:auto;margin:0 auto 1.8rem;display:block}

.band{display:none}
@media (min-width:58rem){
  body[data-desktop="wide"] .band{display:block;position:relative;width:var(--wide);max-width:calc(100vw - 4rem);left:50%;transform:translateX(-50%);margin:1.6rem 0 0}
  .band img{width:100%;aspect-ratio:2500/480;object-fit:cover;display:block;border-radius:1px}
  .band .cap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
  .band .cap b{color:#fff;font-family:"Noto Serif TC",serif;font-weight:500;font-size:1.9rem;letter-spacing:.22em;text-indent:.22em;line-height:1.3}
  .band .cap small{font-family:"Noto Sans TC",sans-serif;font-size:.75rem;letter-spacing:.34em;text-indent:.34em;margin-top:.5rem}
  body[data-desktop="wide"] .band ~ .head h1:not(.company){display:none}
  body[data-desktop="wide"] .has-band .cover{display:none}
}

.cover{position:relative;margin:0 -1.35rem}
.cover img{aspect-ratio:3/2}
.cover img.portrait{object-position:50% 12%}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(to bottom,rgba(0,0,0,0),var(--ink))}
.cover figcaption{position:absolute;left:1.35rem;bottom:.6rem;color:var(--paper-dim);letter-spacing:.06em;text-align:left;margin:0}
.meta{padding-top:1.6rem}
.badge{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:.72rem;letter-spacing:.18em;color:var(--gold);
  border:1px solid var(--gold-dim);padding:.4rem .7rem .35rem;border-radius:2px;line-height:1.4;margin-top:1.6rem}
h1.title{margin-top:1.2rem}
.credits{font-size:.97rem;line-height:1.85}
.credits dl{margin:0;display:grid;grid-template-columns:5.6rem 1fr;gap:.5rem .9rem}
.credits dt{font-family:"Noto Sans TC",sans-serif;font-size:.75rem;letter-spacing:.1em;color:var(--gold);padding-top:.3rem;line-height:1.7}
.credits dd{margin:0}
.review{margin:1.9rem 0 0}
.review:first-of-type{margin-top:1.2rem}
.review .cite{font-size:.99rem;line-height:1.8}
.review .cite .src{font-family:"Noto Sans TC",sans-serif;font-size:.78rem;color:var(--muted);display:block}
blockquote{margin:.6rem 0 0;padding-left:1rem;border-left:2px solid var(--gold-dim);font-size:.99rem;line-height:1.95;color:var(--paper-dim);font-style:italic}
blockquote p{text-indent:0}
.gallery figure img{aspect-ratio:3/2}
.gallery figure.tall img{aspect-ratio:2/3}
.eps{list-style:none;margin:1.3rem 0 0;padding:0}
.eps li{border-top:1px solid var(--rule)}
.eps li:last-child{border-bottom:1px solid var(--rule)}
.eps a{display:flex;justify-content:space-between;align-items:baseline;gap:.7rem;padding:.7rem .35rem;font-size:.94rem;color:var(--paper);text-decoration:none;border-radius:2px}
.eps a:hover{background:rgba(201,162,92,.10)}
.eps .n{font-family:"Noto Sans TC",sans-serif;font-size:.74rem;letter-spacing:.1em;color:var(--gold)}
.eps .d{font-family:"Noto Sans TC",sans-serif;font-size:.78rem;color:var(--muted);white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:1rem;padding:1.4rem 0;font-family:"Noto Sans TC",sans-serif;font-size:.78rem;letter-spacing:.06em}
.pager a{color:var(--muted);text-decoration:none}
@media (min-width:46rem){.cover{margin:0 -2rem}.cover figcaption{left:2rem}}

.phead{padding:1.8rem 0 0}
.phead .badge{margin-top:0}
.phead h1{margin-top:1rem;font-size:1.5rem}
.phead h1 .sub{display:block;font-size:1rem;font-weight:400;color:var(--paper-dim);margin-top:.45rem;letter-spacing:.05em}
.pmeta{font-family:"Noto Sans TC",sans-serif;font-size:.78rem;letter-spacing:.08em;color:var(--muted);margin:1rem 0 0;line-height:1.9;text-align:left}
.dl{display:inline-block;margin-top:1.2rem;font-family:"Noto Sans TC",sans-serif;font-size:.74rem;letter-spacing:.14em;color:var(--cinnabar);border:1px solid rgba(168,69,58,.4);padding:.34rem .7rem .3rem;border-radius:2px;text-decoration:none;line-height:1.5}
.dl:hover{background:rgba(168,69,58,.08)}
.pages{padding-top:2rem}
.pages figure{margin:0 0 1.5rem}
.pages figure img{width:100%;height:auto;aspect-ratio:auto;object-fit:contain;background:#fff;box-shadow:0 1px 5px rgba(31,27,23,.14)}
.pages figcaption{margin-top:.45rem;font-size:.68rem;letter-spacing:.16em}
@media (min-width:58rem){body[data-desktop="wide"] .pages{width:var(--wide);max-width:calc(100vw - 4rem);position:relative;left:50%;transform:translateX(-50%)}}
/* 文字節目冊 */
.meta dl{display:grid;grid-template-columns:3.6rem 1fr;gap:.35rem .9rem;margin:1.5rem 0 0;font-size:.97rem;line-height:1.8}
.meta dt{font-family:"Noto Sans TC",sans-serif;font-size:.74rem;letter-spacing:.14em;color:var(--gold);padding-top:.25rem}
.meta dd{margin:0}
.meta .big{font-size:1.55rem;font-weight:600;line-height:1.4}
.meta .lat{font-family:"EB Garamond",serif;font-style:italic;font-size:1rem;font-weight:400;color:var(--gold)}
h2{font-size:1.2rem;font-weight:600;margin:0 0 1.3rem;letter-spacing:.06em;line-height:1.5}
h2 .en{font-family:"EB Garamond",serif;font-style:italic;font-size:.95rem;font-weight:400;color:var(--gold);margin-left:.7em;letter-spacing:.02em}
dl.credits{margin:0;display:grid;grid-template-columns:12rem 1fr;gap:.35rem 1rem;font-size:.93rem;line-height:1.8}
dl.credits dt{font-family:"Noto Sans TC",sans-serif;font-size:.74rem;letter-spacing:.06em;color:var(--gold);padding-top:.25rem}
dl.credits dd{margin:0}
@media (max-width:40rem){dl.credits{grid-template-columns:1fr;gap:0}dl.credits dd{margin-bottom:.7rem}}
.note{font-family:"Noto Sans TC",sans-serif;font-size:.8rem;line-height:1.9;color:var(--muted);text-align:left;margin-top:1.4rem}
.note+.note{margin-top:.4rem}
.songs h3{font-size:1.08rem;font-weight:600;margin:2.6rem 0 .9rem;letter-spacing:.04em;line-height:1.5}
.songs h3:first-of-type{margin-top:.6rem}
.songs h3 .no{font-family:"EB Garamond",serif;font-weight:400;color:var(--gold);margin-right:.75em;font-variant-numeric:tabular-nums}
.songs h3 .en{font-family:"EB Garamond",serif;font-style:italic;font-size:.92rem;font-weight:400;color:var(--paper-dim);margin-left:.7em;letter-spacing:.02em}
.songs p{font-size:.99rem}
.lyr{text-align:left;line-height:2.05}
[lang=ja]{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif TC",serif}
</style>
</head>
